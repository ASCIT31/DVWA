; PHP runtime hardening for the DVWA image (copied to /usr/local/etc/php/conf.d/)

; PHP2Shell (CVE-2026-109618 / CVE-2026-109619) exposure reduction, as advised
; by php.net: must be set at the php.ini level, not in .user.ini or ini_set()
session.upload_progress.enabled = 0
post_max_size = 8M
upload_max_filesize = 2M

; Do not advertise the PHP version or leak errors to clients
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

# Apache hardening for the DVWA container (enabled with a2enconf in the Dockerfile)
# Installed as zz-dvwa-hardening.conf so it is loaded after the stock security.conf
# (which sets ServerTokens OS / ServerSignature On).

# Do not disclose the Apache/OS version in the Server header or error pages
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# No automatic directory listings anywhere under the web root
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
</Directory>

# Configuration, database files and build files are read from disk by PHP
# (or by the image build) and must never be served over HTTP
<Directory /var/www/html/config>
    Require all denied
</Directory>
<Directory /var/www/html/database>
    Require all denied
</Directory>
<Directory /var/www/html/docker>
    Require all denied
</Directory>
<DirectoryMatch "^/var/www/html/(.*/)?\.git">
    Require all denied
</DirectoryMatch>

# Backup, distribution and editor copies are served as plain text by Apache
# (they are not parsed by PHP), so they are never served at all
<FilesMatch "(?i)(\.(bak|dist|old|orig|save|swp|swo|tmp|sql)|~)$">
    Require all denied
</FilesMatch>
